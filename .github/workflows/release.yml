# Push a tag like v0.1.0: builds the mod and puts the jar on a GitHub Release.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Build
        run: ./gradlew --no-daemon build
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: RedstoneLab ${{ github.ref_name }}
          body: |
            For Minecraft 1.21.11 (Fabric). Needs Fabric API. MaLiLib for the timeline, Mod Menu optional.
            Download `redstonelab-*.jar` (not `-sources`) and put it in your `mods` folder.
          files: |
            build/libs/redstonelab-*.jar
