# Makes a GitHub Release with the jar: runs when mod_version in gradle.properties changes on
# main, or by hand (Actions tab -> Release -> Run workflow). The release is tagged v<mod_version>.
name: Release

on:
  push:
    branches: [main]
    paths: [gradle.properties]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Version
        id: version
        run: echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - name: Build
        run: ./gradlew --no-daemon build
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: RedstoneLab ${{ steps.version.outputs.version }}
          body: |
            For Minecraft 1.21.11 (Fabric). Needs Fabric API only (Mod Menu optional).
            Download `redstonelab-${{ steps.version.outputs.version }}.jar` (not `-sources`) and put it in your `mods` folder.
          files: |
            build/libs/redstonelab-*.jar
